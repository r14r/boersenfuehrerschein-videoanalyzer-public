<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>.b{fill:#f8fafc;stroke:#64748b;stroke-width:2}.t{font:600 21px Arial;fill:#0f172a}.s{font:15px Arial;fill:#475569}.a{stroke:#2563eb;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect class="b" x="40" y="270" width="190" height="90" rx="10"/><text class="t" x="135" y="307" text-anchor="middle">User Query</text><text class="s" x="135" y="334" text-anchor="middle">Wo wird XY erwähnt?</text><rect class="b" x="330" y="100" width="210" height="100" rx="10"/><text class="t" x="435" y="140" text-anchor="middle">FTS5</text><text class="s" x="435" y="168" text-anchor="middle">lexical / exact match</text><rect class="b" x="330" y="430" width="210" height="100" rx="10"/><text class="t" x="435" y="470" text-anchor="middle">Embeddings</text><text class="s" x="435" y="498" text-anchor="middle">semantic similarity</text><line class="a" x1="230" y1="315" x2="330" y2="150"/><line class="a" x1="230" y1="315" x2="330" y2="480"/><rect class="b" x="660" y="270" width="210" height="100" rx="10"/><text class="t" x="765" y="310" text-anchor="middle">Merge &amp; Rank</text><text class="s" x="765" y="338" text-anchor="middle">dedupe + score</text><line class="a" x1="540" y1="150" x2="660" y2="300"/><line class="a" x1="540" y1="480" x2="660" y2="340"/><rect class="b" x="970" y="270" width="190" height="100" rx="10"/><text class="t" x="1065" y="310" text-anchor="middle">Sources</text><text class="s" x="1065" y="338" text-anchor="middle">video + speaker + time</text><line class="a" x1="870" y1="320" x2="970" y2="320"/></svg>