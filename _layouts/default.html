<!DOCTYPE html>
<html lang="{{ site.lang | default: 'de-DE' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <script src="{{ '/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="aviator-nav">
    <h1 class="brand">
      <button type="button" class="open-nav" id="open-nav" aria-label="Navigation öffnen">
        <img src="{{ '/images/menu.svg' | relative_url }}" alt="">
      </button>
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/images/logo.svg' | relative_url }}" alt="{{ site.title }}">
      </a>
    </h1>

    <form action="{{ '/search/' | relative_url }}" method="get" class="search-form">
      <input type="search" name="q" id="search-input" placeholder="Dokumentation durchsuchen" aria-label="Dokumentation durchsuchen">
    </form>

    {% include sidebar.html %}

    <div class="sidebar-meta">
      <a href="{{ site.project_url }}">Anwendung</a>
      <span>·</span>
      <a href="{{ site.repository_url }}">GitHub</a>
    </div>
    <p class="copyright">
      Layout based on <a href="https://github.com/CloudCannon/aviator-jekyll-template">Aviator by CloudCannon</a>
    </p>
  </header>

  <main class="main">
    <section class="doc-content">
      <section class="left-docs">
        {{ content }}
      </section>
    </section>
  </main>

  <script>
    document.getElementById("open-nav").addEventListener("click", function () {
      document.body.classList.toggle("nav-open");
    });
  </script>
</body>
</html>
