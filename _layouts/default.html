<!doctype html>
<html lang="{{ site.lang | default: 'de-DE' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="docs-shell">
    <aside class="docs-sidebar">
      <div class="docs-brand">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p>{{ site.description }}</p>
      </div>
      <nav aria-label="Dokumentation">
        {% for item in site.navigation %}
          <a class="docs-nav-link{% if page.url == item.url %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
      <div class="docs-sidebar-footer">
        <a href="https://github.com/r14r/boersenfuehrerschein-videoanalyzer-public">GitHub Repository</a>
      </div>
    </aside>
    <main class="docs-main"><article class="docs-content">{{ content }}</article></main>
  </div>
</body>
</html>
