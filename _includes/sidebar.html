<nav id="sidebar" class="sidebar" aria-label="Dokumentation">
  <section>
    <h6>Dokumentation</h6>
    <ul>
      {% for item in site.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.permalink == item.url %} class="active"{% endif %}>{{ item.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </section>
</nav>
